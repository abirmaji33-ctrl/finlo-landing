<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrish AI — interview notes for recruiters</title>
    <meta
      name="description"
      content="Abrish AI is a concept for recruiters: stay in the conversation and leave with clear, structured interview notes. Early stage — we're looking for feedback."
    />
    <meta name="theme-color" content="#f8f6ef" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms reads this hidden form at deploy time. Field names must match src/components/Offer.tsx. -->
    <form name="abrish-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="answer" />
      <input type="email" name="email" />
      <input name="linkedin" />
      <input name="ref" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
